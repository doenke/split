name: split

services:
  app:
    image: ghcr.io/doenke/split:latest
    # build: .                     # alternatively build the image locally
    container_name: split-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8347:8347"                # Host:Container – not needed behind a reverse proxy in the same network
    # Values come from a .env file next to this file (docker compose) or from the
    # stack's environment variables (Portainer).
    environment:
      PORT: 8347
      DATABASE_URL: postgres://split:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}@db:5432/split
      UPLOAD_DIR: /data/uploads
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL fehlt}
      TZ: ${TZ:-Europe/Berlin}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Anmelden}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Split}
      # receipt recognition: active as soon as an Anthropic API key is set
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RECEIPT_OCR_ENGINE: ${RECEIPT_OCR_ENGINE:-anthropic}
      RECEIPT_MODEL: ${RECEIPT_MODEL:-}
    volumes:
      - uploads:/data/uploads      # receipts, avatars
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8347/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine
    container_name: split-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: split
      POSTGRES_USER: split
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split -d split"]
      interval: 10s
      timeout: 5s
      retries: 5
    # no "ports:" – the database is only reachable inside the compose network

volumes:
  db:
  uploads:
